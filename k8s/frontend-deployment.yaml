apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-frontend
  namespace: ai-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot-frontend
  template:
    metadata:
      labels:
        app: ai-chatbot-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-username/ai-chatbot-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
