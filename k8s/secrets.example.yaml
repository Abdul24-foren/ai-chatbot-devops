apiVersion: v1
kind: Secret
metadata:
  name: ai-chatbot-secrets
  namespace: ai-chatbot
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql://postgres:replace-me@ai-chatbot-postgres:5432/ai_chatbot
  JWT_SECRET: replace-me-with-a-long-random-secret
  GEMINI_API_KEY: replace-me-with-google-ai-studio-key
