apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-backend
  namespace: ai-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot-backend
  template:
    metadata:
      labels:
        app: ai-chatbot-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub-username/ai-chatbot-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-secrets
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chatbot-secrets
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-chatbot-config
                  key: GEMINI_MODEL
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-chatbot-config
                  key: CLIENT_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
